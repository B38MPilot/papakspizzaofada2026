<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papa K's Pizza — Choose Your Location</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #8B1E2B;
    --red-dark: #6B141F;
    --cream: #FBF6EC;
    --ink: #2A211B;
    --gold: #B08D3D;
    --gold-soft: #D8C089;
    --white: #FFFFFF;
    --shadow: rgba(42,33,27,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- slim signature rule ---- */
  .rule-line{
    height: 3px;
    width: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--red));
  }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 0 24px 56px;
  }

  /* ---- hero / crest ---- */
  .hero{
    text-align: center;
    padding: 48px 0 30px;
  }

  .crest{
    width: 208px;
    height: 208px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: var(--white);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--gold);
    box-shadow:
      inset 0 0 0 6px var(--cream),
      inset 0 0 0 7px var(--gold-soft),
      0 14px 30px var(--shadow);
  }

  /* wraps the circular content that needs clipping (default text OR uploaded image),
     kept separate from the upload/remove buttons so a round overflow:hidden
     doesn't cut the corner buttons off */
  .logo-mask{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .crest-content{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 22px;
  }

  .crest-icon{
    font-size: 24px;
    margin-bottom: 6px;
    opacity: 0.85;
  }

  .crest-name{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 32px;
    color: var(--red);
    line-height: 1.05;
  }

  .crest-rule{
    display: block;
    width: 34px;
    height: 1px;
    background: var(--gold);
    margin: 10px auto;
  }

  .crest-sub{
    font-family: 'Jost', sans-serif;
    font-size: 10.5px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.6;
  }

  .logo-note{
    font-size: 11px;
    color: #9a8c7f;
    margin-top: -4px;
    display: none;
  }

  body.unlocked .logo-note{
    display: block;
  }

  h1{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 18px 0 6px;
    color: var(--ink);
    letter-spacing: 0.2px;
  }

  /* ---- section label ---- */
  .section-label{
    display:flex;
    align-items:center;
    gap: 14px;
    margin: 40px 0 20px;
  }
  .section-label span{
    font-family:'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    white-space: nowrap;
  }
  .section-label::before,
  .section-label::after{
    content:"";
    flex:1;
    height: 1px;
    background: var(--gold-soft);
  }

  /* ---- location buttons ---- */
  .locations{
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .loc-btn{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    width: 100%;
    min-height: 96px;
    padding: 20px 24px;
    background: var(--white);
    border: 1px solid rgba(42,33,27,0.12);
    border-left: 4px solid var(--red);
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 2px 10px rgba(42,33,27,0.05);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .loc-btn:hover{
    box-shadow: 0 10px 26px rgba(42,33,27,0.12);
    transform: translateY(-2px);
    border-left-color: var(--gold);
  }

  .loc-btn:active{
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(42,33,27,0.08);
  }

  .loc-left{
    display:flex;
    align-items:center;
    gap: 18px;
  }

  .loc-icon{
    flex-shrink:0;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 28px;
    border: 1.5px solid var(--gold);
    box-shadow: inset 0 0 0 3px var(--cream), inset 0 0 0 4px var(--gold-soft);
    position: relative;
  }

  .loc-text{
    text-align:left;
  }

  .loc-name{
    font-family:'Playfair Display', serif;
    font-weight: 600;
    font-size: 27px;
    line-height:1.15;
    color: var(--ink);
  }

  .loc-sub{
    font-family: 'Jost', sans-serif;
    font-style: italic;
    font-size: 13px;
    color: #8a7c6c;
    margin-top: 3px;
  }

  .loc-arrow{
    font-size: 22px;
    color: var(--gold);
    flex-shrink:0;
  }

  @media (max-width: 380px){
    .crest{ width:176px; height:176px; }
    .crest-name{ font-size:27px; }
    .loc-name{ font-size:23px; }
  }

  /* ---- edit mode ---- */
  .edit-bar{
    position: sticky;
    top: 0;
    z-index: 20;
    display:flex;
    justify-content:center;
    gap: 10px;
    padding: 12px;
    background: var(--ink);
  }

  .edit-btn{
    font-family:'Jost', sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--white);
    color: var(--ink);
  }

  .edit-btn.primary{
    background: var(--red);
    color: var(--white);
  }

  body.edit-mode [contenteditable="true"]{
    outline: 1.5px dashed var(--red);
    outline-offset: 3px;
    border-radius: 6px;
    cursor: text;
  }

  body.edit-mode [contenteditable="true"]:focus{
    outline-style: solid;
    background: rgba(139,30,43,0.06);
  }

  body.edit-mode .loc-btn{
    cursor: default;
  }

  /* ---- logo image upload ---- */
  .logo-img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: none;
  }

  .logo-upload-btn{
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--white);
    border: 2px solid var(--white);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
    z-index: 2;
  }

  .loc-icon .logo-upload-btn{
    width: 24px;
    height: 24px;
    font-size: 11px;
  }

  .logo-remove-btn{
    position: absolute;
    top: -2px;
    left: -2px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--red);
    color: var(--white);
    border: 2px solid var(--white);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    z-index: 2;
    line-height: 1;
  }

  body.edit-mode .logo-upload-btn{
    display: flex;
  }

  body.edit-mode .logo-slot.has-image .logo-remove-btn{
    display: flex;
  }

  /* ---- owner login (gates all editing tools) ---- */
  .edit-bar{
    display: none;
  }

  body.unlocked .edit-bar{
    display: flex;
  }

  .owner-login{
    text-align: center;
    padding: 18px 0 4px;
  }

  body.unlocked .owner-login{
    display: none;
  }

  .owner-login-link{
    font-family: 'Jost', sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.5px;
    color: #b6a999;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 6px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <!-- Tap the camera icon (in Edit mode) to upload your own logo image -->
    <div class="crest logo-slot" data-logo-id="badge-logo">
      <div class="logo-mask">
        <div class="crest-content">
          <div class="crest-icon" contenteditable="false" data-edit-id="badge-slice">🍕</div>
          <div class="crest-name" contenteditable="false" data-edit-id="badge-name">Papa K's</div>
          <span class="crest-rule"></span>
          <div class="crest-sub" contenteditable="false" data-edit-id="badge-sub">Pizzeria</div>
        </div>
        <img class="logo-img" alt="Papa K's logo">
      </div>
      <button type="button" class="logo-upload-btn" aria-label="Upload logo image">📷</button>
      <button type="button" class="logo-remove-btn" aria-label="Remove logo image">✕</button>
      <input type="file" accept="image/*" class="logo-file-input" hidden>
    </div>
    <div class="logo-note">(tap the camera icon to upload your logo)</div>

    <h1 contenteditable="false" data-edit-id="hero-h1">Find Your Papa K's</h1>
  </div>

  <div class="section-label"><span contenteditable="false" data-edit-id="section-label">Pick a Location</span></div>

  <div class="locations">

    <a class="loc-btn" href="#ada" aria-label="Papa K's Ada location">
      <div class="loc-left">
        <div class="loc-icon logo-slot" data-logo-id="loc1-logo">
          <div class="logo-mask">
            <span contenteditable="false" data-edit-id="loc1-icon">🍕</span>
            <img class="logo-img" alt="Ada location logo">
          </div>
          <button type="button" class="logo-upload-btn" aria-label="Upload Ada logo">📷</button>
          <button type="button" class="logo-remove-btn" aria-label="Remove Ada logo">✕</button>
          <input type="file" accept="image/*" class="logo-file-input" hidden>
        </div>
        <div class="loc-text">
          <div class="loc-name" contenteditable="false" data-edit-id="loc1-name">Ada</div>
          <div class="loc-sub" contenteditable="false" data-edit-id="loc1-sub">Menu, hours &amp; ordering</div>
        </div>
      </div>
      <div class="loc-arrow">›</div>
    </a>

    <a class="loc-btn" href="#mancelona" aria-label="Papa K's Mancelona location">
      <div class="loc-left">
        <div class="loc-icon logo-slot" data-logo-id="loc2-logo">
          <div class="logo-mask">
            <span contenteditable="false" data-edit-id="loc2-icon">🍕</span>
            <img class="logo-img" alt="Mancelona location logo">
          </div>
          <button type="button" class="logo-upload-btn" aria-label="Upload Mancelona logo">📷</button>
          <button type="button" class="logo-remove-btn" aria-label="Remove Mancelona logo">✕</button>
          <input type="file" accept="image/*" class="logo-file-input" hidden>
        </div>
        <div class="loc-text">
          <div class="loc-name" contenteditable="false" data-edit-id="loc2-name">Mancelona</div>
          <div class="loc-sub" contenteditable="false" data-edit-id="loc2-sub">Menu, hours &amp; ordering</div>
        </div>
      </div>
      <div class="loc-arrow">›</div>
    </a>

    <a class="loc-btn" href="#bellaire" aria-label="Papa K's Bellaire location">
      <div class="loc-left">
        <div class="loc-icon logo-slot" data-logo-id="loc3-logo">
          <div class="logo-mask">
            <span contenteditable="false" data-edit-id="loc3-icon">🍕</span>
            <img class="logo-img" alt="Bellaire location logo">
          </div>
          <button type="button" class="logo-upload-btn" aria-label="Upload Bellaire logo">📷</button>
          <button type="button" class="logo-remove-btn" aria-label="Remove Bellaire logo">✕</button>
          <input type="file" accept="image/*" class="logo-file-input" hidden>
        </div>
        <div class="loc-text">
          <div class="loc-name" contenteditable="false" data-edit-id="loc3-name">Bellaire</div>
          <div class="loc-sub" contenteditable="false" data-edit-id="loc3-sub">Menu, hours &amp; ordering</div>
        </div>
      </div>
      <div class="loc-arrow">›</div>
    </a>

  </div>

</div>

<div class="rule-line"></div>

<script>
  (function(){
    // ---- owner login gate ----
    // NOTE: this is a client-side convenience lock only (the password lives in this
    // file's source code), not real security. It just keeps casual visitors from
    // stumbling into the editing tools. Change the password below to your own.
    var OWNER_PASSWORD = 'papaks2026';
    var UNLOCK_KEY = 'papaks_unlocked';
    var body = document.body;
    var ownerLoginBtn = document.getElementById('ownerLoginBtn');

    function unlock(){
      body.classList.add('unlocked');
    }

    if (sessionStorage.getItem(UNLOCK_KEY) === '1') {
      unlock();
    }

    ownerLoginBtn.addEventListener('click', function(){
      var attempt = prompt('Enter the site owner password:');
      if (attempt === null) return;
      if (attempt === OWNER_PASSWORD) {
        sessionStorage.setItem(UNLOCK_KEY, '1');
        unlock();
      } else {
        alert('Incorrect password.');
      }
    });

    var STORAGE_PREFIX = 'papaks_site_';
    var editables = document.querySelectorAll('[data-edit-id]');
    var links = document.querySelectorAll('.loc-btn');
    var toggleBtn = document.getElementById('editToggle');
    var resetBtn = document.getElementById('editReset');
    var editing = false;

    // Load any saved edits on page load
    editables.forEach(function(el){
      var saved = localStorage.getItem(STORAGE_PREFIX + el.dataset.editId);
      if (saved !== null) { el.textContent = saved; }
      el.addEventListener('blur', function(){
        localStorage.setItem(STORAGE_PREFIX + el.dataset.editId, el.textContent);
      });
    });

    // Prevent navigation while editing
    links.forEach(function(a){
      a.addEventListener('click', function(e){
        if (editing) { e.preventDefault(); }
      });
    });

    // ---- logo image upload for badge + each location ----
    var logoSlots = document.querySelectorAll('.logo-slot');

    logoSlots.forEach(function(slot){
      var key = STORAGE_PREFIX + slot.dataset.logoId;
      var img = slot.querySelector('.logo-img');
      var uploadBtn = slot.querySelector('.logo-upload-btn');
      var removeBtn = slot.querySelector('.logo-remove-btn');
      var fileInput = slot.querySelector('.logo-file-input');
      var defaultEls = slot.querySelectorAll('[data-edit-id]');

      function showImage(dataUrl){
        img.src = dataUrl;
        img.style.display = 'block';
        defaultEls.forEach(function(el){ el.style.visibility = 'hidden'; });
        slot.classList.add('has-image');
      }

      function clearImage(){
        img.src = '';
        img.style.display = 'none';
        defaultEls.forEach(function(el){ el.style.visibility = ''; });
        slot.classList.remove('has-image');
      }

      // restore saved logo on load
      var saved = localStorage.getItem(key);
      if (saved) { showImage(saved); }

      uploadBtn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        fileInput.click();
      });

      removeBtn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        localStorage.removeItem(key);
        clearImage();
      });

      fileInput.addEventListener('click', function(e){ e.stopPropagation(); });

      fileInput.addEventListener('change', function(){
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          localStorage.setItem(key, reader.result);
          showImage(reader.result);
        };
        reader.readAsDataURL(file);
      });
    });

    resetBtn.addEventListener('click', function(){
      if (!confirm('Reset all text and logos back to the original?')) return;
      editables.forEach(function(el){
        localStorage.removeItem(STORAGE_PREFIX + el.dataset.editId);
      });
      logoSlots.forEach(function(slot){
        localStorage.removeItem(STORAGE_PREFIX + slot.dataset.logoId);
      });
      location.reload();
    });
  })();
</script>

</body>
</html>
