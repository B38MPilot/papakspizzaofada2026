<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papa K's Pizza — Choose Your Location</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #8B1E2B;
    --red-dark: #6B141F;
    --cream: #FBF6EC;
    --ink: #2A211B;
    --gold: #B08D3D;
    --gold-soft: #D8C089;
    --white: #FFFFFF;
    --shadow: rgba(42,33,27,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .rule-line{
    height: 3px;
    width: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--red));
  }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 0 24px 56px;
  }

  .hero{
    text-align: center;
    padding: 48px 0 30px;
  }

  .crest{
    width: 208px;
    height: 208px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: var(--white);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--gold);
    box-shadow:
      inset 0 0 0 6px var(--cream),
      inset 0 0 0 7px var(--gold-soft),
      0 14px 30px var(--shadow);
  }

  .crest img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  h1{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 18px 0 6px;
    color: var(--ink);
    letter-spacing: 0.2px;
  }

  .section-label{
    display:flex;
    align-items:center;
    gap: 14px;
    margin: 40px 0 20px;
  }
  .section-label span{
    font-family:'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    white-space: nowrap;
  }
  .section-label::before,
  .section-label::after{
    content:"";
    flex:1;
    height: 1px;
    background: var(--gold-soft);
  }

  .locations{
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .loc-btn{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    width: 100%;
    min-height: 96px;
    padding: 20px 24px;
    background: var(--white);
    border: 1px solid rgba(42,33,27,0.12);
    border-left: 4px solid var(--red);
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 2px 10px rgba(42,33,27,0.05);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .loc-btn:hover{
    box-shadow: 0 10px 26px rgba(42,33,27,0.12);
    transform: translateY(-2px);
    border-left-color: var(--gold);
  }

  .loc-btn:active{
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(42,33,27,0.08);
  }

  .loc-left{
    display:flex;
    align-items:center;
    gap: 18px;
  }

  .loc-icon{
    flex-shrink:0;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    border: 1.5px solid var(--gold);
    box-shadow: inset 0 0 0 3px var(--cream), inset 0 0 0 4px var(--gold-soft);
    position: relative;
    overflow: hidden;
  }

  .loc-icon img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .loc-text{
    text-align:left;
  }

  .loc-name{
    font-family:'Playfair Display', serif;
    font-weight: 600;
    font-size: 27px;
    line-height:1.15;
    color: var(--ink);
  }

  .loc-sub{
    font-family: 'Jost', sans-serif;
    font-style: italic;
    font-size: 13px;
    color: #8a7c6c;
    margin-top: 3px;
  }

  .loc-arrow{
    font-size: 22px;
    color: var(--gold);
    flex-shrink:0;
  }

  @media (max-width: 380px){
    .crest{ width:176px; height:176px; }
    .loc-name{ font-size:23px; }
  }
</style>
</head>
